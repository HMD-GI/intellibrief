<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliBrief 控制台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">IB</div>
        <div>
          <div class="brand-title">IntelliBrief</div>
          <div class="brand-subtitle">每日情报工作台</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">工作台</button>
        <button class="nav-item" data-view="briefs">简报列表</button>
        <button class="nav-item" data-view="bindings">绑定设置</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">工作台</h1>
          <p id="pageSubtitle">选择主题，生成或安排今日简报。</p>
        </div>
        <button id="refreshBtn" class="icon-btn" title="刷新">↻</button>
      </header>

      <section id="toast" class="toast hidden"></section>

      <section id="dashboardView" class="view active">
        <div class="grid two">
          <section class="panel">
            <div class="panel-head">
              <h2>主题</h2>
              <span>可多选</span>
            </div>
            <div id="topicGroup" class="chip-group"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>生成</h2>
              <span>今日简报</span>
            </div>
            <button id="generateTodayBtn" class="primary-btn">一键生成当日简报</button>
            <div class="schedule-row">
              <input id="scheduleTime" type="time" value="07:00">
              <button id="saveScheduleBtn" class="secondary-btn">保存定时</button>
            </div>
          </section>
        </div>

        <section class="panel">
          <div class="panel-head">
            <h2>最近简报</h2>
            <button id="openBriefListBtn" class="link-btn">查看全部</button>
          </div>
          <div id="recentBriefs" class="brief-table compact"></div>
        </section>
      </section>

      <section id="briefsView" class="view">
        <section class="panel">
          <div class="filter-bar">
            <label>开始时间<input id="startDate" type="date"></label>
            <label>结束时间<input id="endDate" type="date"></label>
            <label>类型
              <select id="briefType">
                <option value="all">全部</option>
                <option value="daily">每日简报</option>
              </select>
            </label>
            <button id="searchBriefsBtn" class="secondary-btn">查询</button>
          </div>
          <div id="briefList" class="brief-table"></div>
        </section>
      </section>

      <section id="bindingsView" class="view">
        <div class="grid two">
          <section class="panel">
            <div class="panel-head">
              <h2>邮箱</h2>
              <span>选填</span>
            </div>
            <label>发件邮箱<input id="emailSender" placeholder="name@example.com"></label>
            <label>授权码<input id="emailPassword" type="password" placeholder="SMTP 授权码"></label>
            <label>收件人<input id="emailReceivers" placeholder="多个邮箱用逗号分隔"></label>
          </section>
          <section class="panel">
            <div class="panel-head">
              <h2>飞书</h2>
              <span>选填</span>
            </div>
            <label>Webhook<input id="feishuWebhook" placeholder="https://open.feishu.cn/..."></label>
          </section>
        </div>
        <section class="panel actions-panel">
          <button id="saveBindingsBtn" class="primary-btn">保存绑定</button>
          <button id="clearBindingsBtn" class="secondary-btn">清空绑定</button>
        </section>
      </section>
    </main>
  </div>

  <div id="briefModal" class="modal hidden">
    <div class="modal-card">
      <header>
        <h2 id="modalTitle">简报详情</h2>
        <button id="closeModalBtn" class="icon-btn" title="关闭">×</button>
      </header>
      <iframe id="briefFrame" title="简报内容"></iframe>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
